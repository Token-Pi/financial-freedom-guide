<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>每月定投 5 年复利估算器</title>
  <style>
    body, svg, button, input, select {
      font-family: var(--ff-sans, 'Google Sans Flex', 'Google Sans', sans-serif);
    }
    .preset-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .kpi-val {
      font-size: 24px;
      line-height: 30px;
      font-weight: 470;
      font-variant-numeric: tabular-nums;
      color: var(--on-surface);
      margin-top: 4px;
    }
    .kpi-sub {
      font-size: 12px;
      color: var(--on-surface-variant);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .split-stage {
      background: var(--surface-bright);
      border-radius: var(--r-m);
      padding: 16px 20px;
      margin-bottom: 14px;
    }
    .split-bar {
      display: flex;
      height: 28px;
      border-radius: var(--r-s);
      overflow: hidden;
      gap: 2px;
      margin-bottom: 12px;
    }
    .split-seg {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      transition: width 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
    }
    .legend-row {
      display: flex;
      gap: 18px;
      font-size: 13px;
      color: var(--on-surface-variant);
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .yearly-bars {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .yr-row {
      display: grid;
      grid-template-columns: 56px 1fr 96px;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .yr-label {
      color: var(--on-surface-variant);
    }
    .yr-track {
      height: 14px;
      background: var(--surface-dim);
      border-radius: var(--r-s);
      overflow: hidden;
      display: flex;
    }
    .yr-principal {
      background: var(--chart-1);
      height: 100%;
      transition: width 0.15s ease;
    }
    .yr-gain {
      background: var(--chart-3);
      height: 100%;
      transition: width 0.15s ease;
    }
    .yr-val {
      text-align: right;
      color: var(--on-surface);
      font-weight: 500;
    }
    .control-deck {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px 20px;
      background: var(--surface-bright);
      border-radius: var(--r-m);
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <div class="preset-row">
      <span class="lumi-label-s" style="color: var(--on-surface-variant); font-size: 13px;">收益率情景预设</span>
      <div class="lumi-segmented-group" role="group" aria-label="收益率情景预设">
        <button type="button" class="lumi-segmented-btn" data-rate="7">保守 7%</button>
        <button type="button" class="lumi-segmented-btn is-active" data-rate="10">历史均值 10%</button>
        <button type="button" class="lumi-segmented-btn" data-rate="13.8">近十年 13.8%</button>
      </div>
    </div>

    <div class="kpi-strip">
      <div class="lumi-summary-card">
        <div class="lumi-label-s" style="color: var(--on-surface-variant);">期末预计总资产</div>
        <div class="kpi-val" id="out-total">S$232,311</div>
        <div class="kpi-sub" id="out-horizon">5 年（60 期）</div>
      </div>
      <div class="lumi-summary-card">
        <div class="lumi-label-s" style="color: var(--on-surface-variant);">累计投入本金</div>
        <div class="kpi-val" id="out-principal">S$180,000</div>
        <div class="kpi-sub" id="out-monthly-sub">每月 S$3,000</div>
      </div>
      <div class="lumi-summary-card">
        <div class="lumi-label-s" style="color: var(--on-surface-variant);">预计复利收益</div>
        <div class="kpi-val" id="out-gain" style="color: var(--positive);">+S$52,311</div>
        <div class="kpi-sub" id="out-gain-pct">收益率 +29.1%</div>
      </div>
    </div>

    <div class="split-stage">
      <div class="split-bar" role="img" aria-label="本金与复利收益占比">
        <div id="seg-principal" class="split-seg" style="background: var(--chart-1); width: 77%;">77%</div>
        <div id="seg-gain" class="split-seg" style="background: var(--chart-3); width: 23%;">23%</div>
      </div>
      <div class="legend-row">
        <span><span class="legend-dot" style="background: var(--chart-1);"></span>累计本金</span>
        <span><span class="legend-dot" style="background: var(--chart-3);"></span>复利收益</span>
      </div>
      <div class="yearly-bars" id="yearly-bars"></div>
    </div>

    <div class="control-deck">
      <div class="lumi-slider-row">
        <label class="lumi-slider-label" for="in-monthly">每月定投金额 (SGD)</label>
        <div class="lumi-slider-container">
          <input id="in-monthly" class="lumi-slider" type="range" min="500" max="10000" step="500" value="3000" style="--progress: 26.3%;">
          <div id="val-monthly" class="lumi-slider-value">S$3,000</div>
        </div>
      </div>
      <div class="lumi-slider-row">
        <label class="lumi-slider-label" for="in-years">定投年限</label>
        <div class="lumi-slider-container">
          <input id="in-years" class="lumi-slider" type="range" min="1" max="20" step="1" value="5" style="--progress: 21.1%;">
          <div id="val-years" class="lumi-slider-value">5 年</div>
        </div>
      </div>
      <div class="lumi-slider-row">
        <label class="lumi-slider-label" for="in-rate">预期年化收益率</label>
        <div class="lumi-slider-container">
          <input id="in-rate" class="lumi-slider" type="range" min="0" max="20" step="0.2" value="10" style="--progress: 50%;">
          <div id="val-rate" class="lumi-slider-value">10.0%</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function getCssVar(name, fallback = '') {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
    }
    function contrastText(bg) {
      const c = (bg || '').replace(/\s/g, '');
      let r = 0, g = 0, b = 0;
      if (c.startsWith('#')) {
        const hex = c.slice(1);
        const full = hex.length === 3 ? hex.split('').map(x => x + x).join('') : hex;
        r = parseInt(full.slice(0, 2), 16);
        g = parseInt(full.slice(2, 4), 16);
        b = parseInt(full.slice(4, 6), 16);
      } else {
        const m = c.match(/\d+/g);
        if (!m || m.length < 3) return getCssVar('--on-surface', '#000000');
        [r, g, b] = m.map(Number);
      }
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return lum > 0.45 ? '#000000' : '#ffffff';
    }
    function syncSlider(slider) {
      const min = parseFloat(slider.min || '0');
      const max = parseFloat(slider.max || '100');
      const val = parseFloat(slider.value || '0');
      slider.style.setProperty('--progress', `${((val - min) / (max - min)) * 100}%`);
    }

    const fmtSGD = new Intl.NumberFormat('en-SG', { maximumFractionDigits: 0 });
    const monthlyEl = document.getElementById('in-monthly');
    const yearsEl = document.getElementById('in-years');
    const rateEl = document.getElementById('in-rate');
    const presetBtns = Array.from(document.querySelectorAll('.lumi-segmented-btn'));

    function fvMonthly(pmt, annualPct, months) {
      const rm = annualPct / 100 / 12;
      if (rm === 0) return pmt * months;
      return pmt * ((Math.pow(1 + rm, months) - 1) / rm);
    }

    function updateCalc() {
      syncSlider(monthlyEl);
      syncSlider(yearsEl);
      syncSlider(rateEl);

      const pmt = parseFloat(monthlyEl.value);
      const years = parseInt(yearsEl.value, 10);
      const rate = parseFloat(rateEl.value);
      const months = years * 12;

      const principal = pmt * months;
      const total = fvMonthly(pmt, rate, months);
      const gain = total - principal;
      const gainPct = principal > 0 ? (gain / principal) * 100 : 0;

      document.getElementById('val-monthly').textContent = `S$${fmtSGD.format(pmt)}`;
      document.getElementById('val-years').textContent = `${years} 年`;
      document.getElementById('val-rate').textContent = `${rate.toFixed(1)}%`;

      document.getElementById('out-total').textContent = `S$${fmtSGD.format(Math.round(total))}`;
      document.getElementById('out-horizon').textContent = `${years} 年（${months} 期）`;
      document.getElementById('out-principal').textContent = `S$${fmtSGD.format(Math.round(principal))}`;
      document.getElementById('out-monthly-sub').textContent = `每月 S$${fmtSGD.format(pmt)}`;
      document.getElementById('out-gain').textContent = `+S$${fmtSGD.format(Math.round(gain))}`;
      document.getElementById('out-gain-pct').textContent = `累计收益率 +${gainPct.toFixed(1)}%`;

      const pShare = total > 0 ? Math.round((principal / total) * 100) : 100;
      const gShare = 100 - pShare;
      const segP = document.getElementById('seg-principal');
      const segG = document.getElementById('seg-gain');
      segP.style.width = `${pShare}%`;
      segP.textContent = pShare >= 12 ? `${pShare}%` : '';
      segP.style.color = contrastText(getCssVar('--chart-1', '#2575fc'));
      segG.style.width = `${gShare}%`;
      segG.textContent = gShare >= 12 ? `${gShare}%` : '';
      segG.style.color = contrastText(getCssVar('--chart-3', '#228a49'));

      presetBtns.forEach(btn => {
        const bRate = parseFloat(btn.dataset.rate);
        btn.classList.toggle('is-active', Math.abs(bRate - rate) < 0.05);
      });

      const barsEl = document.getElementById('yearly-bars');
      const stepYr = years > 6 ? Math.ceil(years / 5) : 1;
      const checkpoints = [];
      for (let y = stepYr; y < years; y += stepYr) checkpoints.push(y);
      checkpoints.push(years);

      const rows = checkpoints.map(y => {
        const m = y * 12;
        const p = pmt * m;
        const v = fvMonthly(pmt, rate, m);
        const g = Math.max(0, v - p);
        const pW = total > 0 ? (p / total) * 100 : 0;
        const gW = total > 0 ? (g / total) * 100 : 0;
        return `<div class="yr-row">
          <span class="yr-label">第 ${y} 年</span>
          <div class="yr-track">
            <div class="yr-principal" style="width: ${pW.toFixed(2)}%;"></div>
            <div class="yr-gain" style="width: ${gW.toFixed(2)}%;"></div>
          </div>
          <span class="yr-val">S$${fmtSGD.format(Math.round(v))}</span>
        </div>`;
      }).join('');
      barsEl.innerHTML = rows;
    }

    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        rateEl.value = btn.dataset.rate;
        updateCalc();
      });
    });
    monthlyEl.addEventListener('input', updateCalc);
    yearsEl.addEventListener('input', updateCalc);
    rateEl.addEventListener('input', updateCalc);
    updateCalc();
  </script>
</body>
</html>
